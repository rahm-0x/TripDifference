{# Header shared by /cars and /stays: a way back to Home, and the switch between the two. #}
<div class="cs-head">
  <a href="{{ url_for('overview') }}" class="cs-back">← Home</a>
  <div class="cs-tabs" role="tablist">
    <a href="{{ url_for('cars_search') }}" class="{{ 'on' if cs_tab == 'cars' }}" role="tab">Cars</a>
    <a href="{{ url_for('stays_search') }}" class="{{ 'on' if cs_tab == 'stays' }}" role="tab">Stays</a>
  </div>
</div>

{% if unavailable %}
<div class="notice" style="margin-bottom:16px"><span>i</span><div>{{ unavailable }}</div></div>
{% endif %}

<style>
  .cs-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
  .cs-back { font-size:13px; color:var(--muted); text-decoration:none; }
  .cs-back:hover { color:var(--text); }
  .cs-tabs { display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--line);
             border-radius:var(--r-sm); padding:3px; }
  .cs-tabs a { padding:6px 16px; border-radius:calc(var(--r-sm) - 2px); font-size:13px;
               color:var(--muted); text-decoration:none; font-weight:500; }
  .cs-tabs a.on { background:var(--surface); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .cs-note { font-size:12.5px; color:var(--muted); margin:14px 0 0; }
  .cs-results-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px;
                     margin:24px 0 12px; flex-wrap:wrap; }
  .cs-results-head h2 { font-size:16px; }
  .cs-results-head span { font-size:12.5px; color:var(--muted); }
  .cs-list { display:flex; flex-direction:column; gap:10px; }
  .cs-row { display:grid; grid-template-columns:96px 1fr auto; gap:16px; align-items:center; padding:14px 16px; }
  .cs-row img.thumb { width:96px; height:64px; object-fit:contain; border-radius:6px; background:var(--surface-2); }
  .cs-row .thumb-empty { width:96px; height:64px; border-radius:6px; background:var(--surface-2); }
  .cs-row h3 { font-size:14.5px; margin:0 0 3px; }
  .cs-meta { font-size:12px; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap; }
  .cs-price { text-align:right; }
  .cs-price .amt { font-family:'IBM Plex Mono', monospace; font-size:18px; font-weight:500;
                   font-variant-numeric:tabular-nums; }
  .cs-price .cur { font-size:11px; color:var(--muted-2); margin-left:3px; }
  .cs-price .tag { margin-top:6px; }
  @media (max-width:640px) {
    .cs-row { grid-template-columns:64px 1fr; }
    .cs-row img.thumb, .cs-row .thumb-empty { width:64px; height:44px; }
    .cs-price { grid-column:1 / -1; text-align:left; display:flex; gap:10px; align-items:center; }
    .cs-price .tag { margin-top:0; }
  }
</style>
