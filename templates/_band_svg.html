{# Shared difference-band SVG. Expects `band` (from app.difference_band /
   aggregate_difference_band) and a unique `band_id` in scope so multiple
   bands on one page (unlikely today, cheap to guard against) don't clash
   over clipPath ids. #}
<svg viewBox="0 0 {{ band.w }} {{ band.h }}" preserveAspectRatio="none"
     style="width:100%; height:180px; display:block" role="img"
     aria-label="Difference between what was paid and today's market price">
  <defs>
    <clipPath id="band-below-{{ band_id|default('home') }}"><path d="{{ band.below_clip }}"/></clipPath>
    <clipPath id="band-above-{{ band_id|default('home') }}"><path d="{{ band.above_clip }}"/></clipPath>
  </defs>
  <g clip-path="url(#band-above-{{ band_id|default('home') }})">
    <path d="{{ band.area_path }}" fill="rgba(47,93,138,0.10)"/>
  </g>
  <g clip-path="url(#band-below-{{ band_id|default('home') }})">
    <path d="{{ band.area_path }}" fill="rgba(61,122,83,0.20)"/>
  </g>
  <path d="{{ band.base_path }}" fill="none" stroke="#8a8f96" stroke-width="1.25" stroke-dasharray="4 3"/>
  <path d="{{ band.line_path }}" fill="none" stroke="#1a1d21" stroke-width="1.4" stroke-linejoin="round"/>
</svg>
