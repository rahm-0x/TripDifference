{% extends "base.html" %}
{% block title %}Create your account — Trip Difference{% endblock %}
{% block body %}

<div class="auth">
  <div class="page-head" style="text-align:center">
    <h1>Create your account</h1>
    <p>We'll get to know you on the next step.</p>
  </div>

  {% if error %}
  <div class="notice" style="margin-bottom:16px; border-color:rgba(217,95,95,.3)">
    <span>!</span><div>{{ error }}</div>
  </div>
  {% endif %}

  <div class="card">
    <form method="post" action="{{ url_for('signup') }}">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" value="{{ email or '' }}"
               placeholder="you@example.com" required autofocus>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="10"
               placeholder="At least 10 characters" required>
      </div>

      <div class="field">
        <label for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" minlength="10"
               placeholder="Re-enter it" required>
      </div>

      <button type="submit" class="btn-block" style="margin-top:6px">Create Account</button>
    </form>

    <div class="auth-divider"><span>OR</span></div>

    <a href="{{ url_for('google_auth_start') }}" class="btn-block btn-ghost auth-google">
      <svg width="17" height="17" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.6 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.4 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.4 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.4 26.7 36 24 36c-5.3 0-9.7-3.4-11.3-8.1l-6.5 5C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.6l6.2 5.2C40.9 36.5 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      Continue with Google
    </a>
  </div>

  <p class="foot">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
</div>

<style>
  .auth { max-width:440px; margin:40px auto 0; }
  .foot { text-align:center; margin-top:18px; font-size:13.5px; color:var(--muted); }
  .auth-divider { display:flex; align-items:center; gap:12px; margin:18px 0; color:var(--muted-2); font-size:12px; }
  .auth-divider::before, .auth-divider::after { content:''; flex:1; height:1px; background:var(--line); }
  .auth-google { display:flex; align-items:center; justify-content:center; gap:10px; }
</style>

{% endblock %}
