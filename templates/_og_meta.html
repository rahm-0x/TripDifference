{# The link preview every page shares (Slack, iMessage, LinkedIn, X…). Included
   in each template that owns a <head>: base, landing, info, legal. Crawlers
   need absolute URLs. public/og.png is 2400×1260, 2× the 1200×630 card. #}
<meta name="description" content="We watch the price after you book and recover the difference when it drops. You only pay when you save.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Trip Difference">
<meta property="og:title" content="Your fare dropped. You get the difference.">
<meta property="og:description" content="We watch the price after you book and recover the difference when it drops. You only pay when you save.">
<meta property="og:url" content="{{ request.base_url }}">
<meta property="og:image" content="{{ url_for('og_image', _external=True) }}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="2400">
<meta property="og:image:height" content="1260">
<meta property="og:image:alt" content="Trip Difference: you paid $412, the price is now $287, $125 recovered to your card.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Your fare dropped. You get the difference.">
<meta name="twitter:description" content="We watch the price after you book and recover the difference when it drops. You only pay when you save.">
<meta name="twitter:image" content="{{ url_for('og_image', _external=True) }}">
